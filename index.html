<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KENT STOP ONLINE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        🎴 KENT STOP
    </div>

    <div class="room">
        Room:
        <b id="headerRoom">------</b>
    </div>

</header>


<!-- ================= HOME ================= -->

<section id="homePage" class="page">

    <div class="home-box">

        <h1>KENT STOP</h1>

        <p class="subtitle">
            Online Card Game
        </p>

        <input
            id="nickname"
            type="text"
            placeholder="Քո անունը"
            maxlength="20"
        >

        <button id="createGameBtn" class="primary">
            🏠 Ստեղծել խաղ
        </button>

        <div class="separator">
            կամ
        </div>

        <input
            id="roomCode"
            type="text"
            placeholder="Խաղի կոդը"
            maxlength="6"
        >

        <button id="joinGameBtn" class="secondary">
            🔑 Միանալ խաղին
        </button>

        <div id="errorMessage"></div>

    </div>

</section>


<!-- ================= LOBBY ================= -->

<section id="lobbyPage" class="page hidden">

    <div class="lobby-box">

        <h1>🎮 Խաղասենյակ</h1>

        <div class="room-code-box">

            <span>Խաղի կոդը</span>

            <strong id="displayRoomCode">
                ------
            </strong>

            <button id="copyCodeBtn">
                📋 Պատճենել
            </button>

        </div>


        <div class="players-header">

            <h2>Խաղացողներ</h2>

            <span id="playerCount">
                0/4
            </span>

        </div>


        <div id="playersList" class="players-list"></div>


        <div id="lobbyMessage" class="lobby-message">
            Սպասում ենք խաղացողներին...
        </div>


        <button
            id="startGameBtn"
            class="start-btn"
        >
            ▶ Սկսել խաղը
        </button>


        <button
            id="leaveGameBtn"
            class="leave-btn"
        >
            ← Դուրս գալ
        </button>

    </div>

</section>


<!-- ================= GAME ================= -->

<section id="gamePage" class="page hidden">

    <div class="game-table">

        <div class="game-info">

            <div>
                Room:
                <b id="gameRoomCode">------</b>
            </div>

            <div>
                Դու՝
                <b id="myPlayerName">---</b>
            </div>

        </div>


        <!-- PLAYERS -->

        <div id="gamePlayers" class="game-players">

        </div>


        <!-- CENTER -->

        <div class="center-area">

            <div
                id="tableMessage"
                class="table-message"
            >
                🎮 Խաղը սկսվում է...
            </div>

            <div
                id="turnMessage"
                class="turn-message"
            >
                Սպասում ենք...
            </div>

        </div>


        <!-- CARDS -->

        <div class="my-hand">

            <div class="hand-title">
                Քո քարտերը
            </div>

            <div
                id="cardsArea"
                class="cards-area"
            ></div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                id="kentBtn"
                class="kent-btn"
            >
                KENT
            </button>

            <button
                id="stopBtn"
                class="stop-btn"
            >
                STOP
            </button>

        </div>


        <button
            id="gameLeaveBtn"
            class="game-leave"
        >
            Դուրս գալ խաղից
        </button>

    </div>

</section>


<script
    type="module"
    src="app.js"
></script>

</body>
</html>
